<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | nhy</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <nav class="container">
      <a href="index.html">Home</a>
      <a href="project.html">Projects</a>
      <a href="contact.html">Contact</a>
      <button id="theme-btn" class="btn btn-sm btn-outline-light" type="button">Light mode</button>
    </nav>
  </header>

  <main class="container py-4">
    <h1>Contact me</h1>
    <p>Got a song rec, or want to say hi? Fill this out.</p>

    <form id="contact-form" class="card card-body">
      <label for="name">Your name</label>
      <input id="name" class="form-control mb-1" type="text" required>
      <p id="name-msg" class="field-msg" aria-live="polite"></p>

      <label for="email">Your email</label>
      <input id="email" class="form-control mb-1" type="email" required>
      <p id="email-msg" class="field-msg" aria-live="polite"></p>

      <label for="message">Your message (at least 20 characters)</label>
      <textarea id="message" class="form-control mb-1" rows="4" required></textarea>
      <p id="message-msg" class="field-msg" aria-live="polite"></p>

      <button class="btn btn-success align-self-start" type="submit" id="send-btn">Send</button>
    </form>
    <p id="thanks" class="mt-3" aria-live="polite"></p>
  </main>

  <footer class="container">
    <p>&copy; 2026 Nhy'Airah</p>
  </footer>

  <script src="theme.js"></script>
  <script src="contact.js"></script>
</body>
</html>
