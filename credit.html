<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Credit Score Checker | nhy</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <nav class="container">
      <a href="index.html">Home</a>
      <a href="project.html">Projects</a>
      <a href="contact.html">Contact</a>
      <button id="theme-btn" class="btn btn-sm btn-outline-light" type="button">Light mode</button>
    </nav>
  </header>

  <main class="container py-4">
    <h1>Credit Score Checker</h1>
    <p>Type a credit score to see its rating. Built in class (Week 10).</p>
    <div class="input-group">
      <label for="score" class="visually-hidden">Credit score</label>
      <input id="score" class="form-control" placeholder="Credit score">
      <button id="check" class="btn btn-success">Check</button>
    </div>
    <p id="rating" class="mt-3"></p>

    <h2 class="mt-4">Score Ranges</h2>
    <ul id="ranges"></ul>

    <h2 class="mt-4">Score Factors</h2>
    <ul id="factors"></ul>
    <p><a href="project.html">Back to Projects</a></p>
  </main>

  <footer class="container">
    <p>&copy; 2026 Nhy'Airah</p>
  </footer>

  <script src="theme.js"></script>
  <script src="credit.js"></script>
</body>
</html>
